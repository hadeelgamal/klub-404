<!-- KLUB404 email signature — company template -->
<!-- Fill in {{NAME}} and {{TITLE}} before pasting into Gmail. See README.md for setup steps. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
  <tr>
    <td style="padding:0 18px 0 0; border-right:1px solid #E8E6E2;" valign="middle">
      <!--[if mso]>
      <img src="https://klub-404.com/email-signature/logo-static.png" width="140" height="35" alt="KLUB404" style="display:block; border:0;">
      <![endif]-->
      <!--[if !mso]><!-->
      <img src="https://klub-404.com/email-signature/logo.gif" width="140" height="35" alt="KLUB404" style="display:block; border:0;">
      <!--<![endif]-->
    </td>
    <td style="padding:0 0 0 18px;" valign="middle">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:15px; font-weight:700; color:#0D0D0D; line-height:1.4; padding:0 0 3px 0;">
            {{NAME}}
          </td>
        </tr>
        <tr>
          <td style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:12px; font-weight:400; letter-spacing:0.06em; text-transform:uppercase; color:#747474; line-height:1.4; padding:0 0 10px 0;">
            {{TITLE}}
          </td>
        </tr>
        <tr>
          <td style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:12px; font-weight:600; letter-spacing:0.04em; line-height:1.4;">
            <a href="https://klub-404.com" style="color:#FF4D00; text-decoration:none;">KLUB-404.COM</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
